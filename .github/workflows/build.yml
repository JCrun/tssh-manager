name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  WAILS_VERSION: v2.17.1

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev openssh-client

      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME}"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Frontend type check
        working-directory: frontend
        run: |
          npm ci
          npx svelte-check --tsconfig ./tsconfig.json

      - name: Build
        run: wails build -tags webkit2_41 -clean -trimpath -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}"

      - name: Go tests
        run: |
          go vet -tags webkit2_41 ./...
          go test -tags webkit2_41 ./...

      - name: Package
        id: pkg
        run: |
          v="${{ steps.ver.outputs.version }}"
          name="tssh-manager-${v}-linux-amd64"
          mkdir -p "dist/$name"
          cp build/bin/tssh-manager build/tssh-manager.svg README.md "dist/$name/"
          cp scripts/install.sh "dist/$name/install.sh"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          file "dist/$name/tssh-manager"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ### Install

          Requires GTK 3 and WebKitGTK 4.1 (Arch/CachyOS: `webkit2gtk-4.1`; Debian/Ubuntu: `libwebkit2gtk-4.1-0`) and [tssh](https://github.com/trzsz/trzsz-ssh).

          ```sh
          tar xzf tssh-manager-*-linux-amd64.tar.gz
          cd tssh-manager-*-linux-amd64 && ./install.sh
          ```

          This installs `~/.local/bin/tssh-manager` plus an app-menu entry. `./install.sh --uninstall` removes them.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
